<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>云音乐管家</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text"><b>云音乐管家</b><span>网易云歌单与单曲下载管理</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="miniStats" class="mini-stats"></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="tb-left">
        <h1 id="pageTitle">首页</h1>
        <p id="pageSub"></p>
      </div>
      <div class="tb-right">
        <div id="netBadge" class="badge neutral">检测中</div>
        <button id="themeBtn" class="icon-btn" title="切换主题"></button>
      </div>
    </header>
    <section id="view"></section>
  </main>
  <nav id="tabbar"></nav>
</div>
<div id="boot" class="boot"><div class="boot-in"><div class="spin"></div><div class="boot-t">正在启动云音乐管家</div><div class="boot-s" id="bootMsg">正在初始化本地数据库与界面…</div></div></div>
<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>
<script src="js/util.js"></script>
<script src="js/pages.js"></script>
<script src="js/pages2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
